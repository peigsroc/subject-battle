<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>整數加減大決戰 - 雙人即時對戰</title>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; }
        
        .screen { display: none; width: 100vw; height: 100vh; padding: 15px; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }

        .author-tag { position: fixed; top: 10px; right: 15px; font-size: 13px; color: #94a3b8; z-index: 999; background: rgba(15, 23, 42, 0.6); padding: 4px 8px; border-radius: 4px; border: 1px solid #334155; }

        .card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); text-align: center; }
        h1 { font-size: 28px; color: #38bdf8; margin-bottom: 8px; font-weight: 800; }
        p.subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
        
        input[type="text"] { width: 100%; padding: 12px 16px; font-size: 16px; border-radius: 8px; border: 2px solid #475569; background: #0f172a; color: #fff; margin-bottom: 16px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        .btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; background: #0284c7; color: #fff; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; }
        .btn:hover { background: #0369a1; }
        .btn:active { transform: scale(0.98); }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-secondary { background: #475569; }

        .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #334155; color: #38bdf8; display: inline-block; margin-top: 10px; }

        .room-list { width: 100%; max-height: 200px; overflow-y: auto; margin: 15px 0; border: 1px solid #334155; border-radius: 8px; background: #0f172a; }
        .room-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #1e293b; }
        .room-item:last-child { border-bottom: none; }
        .room-item .btn { width: auto; padding: 6px 12px; font-size: 14px; margin-bottom: 0; }

        .battle-hud { display: flex; width: 100%; max-width: 800px; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        .player-box { display: flex; align-items: center; gap: 10px; }
        .player-avatar { font-size: 32px; }
        .player-info { text-align: left; }
        .player-info.right { text-align: right; }
        .hp-bar { width: 100px; height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-top: 4px; }
        .hp-fill { height: 100%; background: #22c55e; transition: width 0.3s ease; }

        .question-card { background: #1e293b; border: 2px solid #334155; border-radius: 16px; padding: 20px; width: 100%; max-width: 800px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .question-text { font-size: 36px; font-weight: bold; color: #f1f5f9; margin-bottom: 20px; letter-spacing: 2px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .option-btn { background: #334155; border: 2px solid #475569; color: #fff; font-size: 24px; font-weight: bold; padding: 16px; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
        .option-btn:hover { background: #475569; border-color: #38bdf8; }
        .option-btn:active { transform: scale(0.97); }

        @keyframes anim-hit { 0% { transform: scale(1); } 50% { transform: scale(1.1); color: #22c55e; } 100% { transform: scale(1); } }
        @keyframes anim-shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        .effect-hit { animation: anim-hit 0.4s ease; }
        .effect-shake { animation: anim-shake 0.4s ease; background: #7f1d1d !important; }

        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .overlay.active { display: flex; }
        .overlay-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .overlay-desc { font-size: 18px; color: #94a3b8; margin-bottom: 20px; text-align: center; }

        #portrait-warning { display: none; z-index: 9999; background: #0f172a; }
        @media (orientation: portrait) and (max-width: 768px) {
            #portrait-warning { display: flex; }
        }
    </style>
</head>
<body>

    <div class="author-tag">裴老師設計</div>

    <div id="portrait-warning" class="overlay active">
        <div style="font-size: 48px; margin-bottom: 10px;">↻</div>
        <div class="overlay-title">請將手機轉為橫向</div>
        <div class="overlay-desc">為了獲得最佳對戰體驗，請旋轉您的裝置。</div>
    </div>

    <div id="screen-login" class="screen active">
        <div class="card">
            <h1>整數加減大決戰</h1>
            <p class="subtitle">七年級數學學科即時線上對戰</p>
            <input type="text" id="input-nickname" placeholder="請輸入暱稱 (1-20字)" maxlength="20">
            <button class="btn" onclick="app.enterLobby()">進入遊戲大廳</button>
            <div id="db-status" class="status-badge">連線中...</div>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <div class="card">
            <h1>遊戲大廳</h1>
            <p class="subtitle">玩家：<span id="display-nickname" style="color: #38bdf8;"></span></p>
            <button class="btn" onclick="app.createRoom()">建立房間</button>
            <div style="text-align: left; font-size: 14px; color: #94a3b8; margin-top: 10px;">等待對戰中的房間：</div>
            <div id="room-list" class="room-list">
                <div style="padding: 15px; color: #64748b; font-size: 14px;">尋找房間中...</div>
            </div>
            <button class="btn btn-secondary" onclick="app.refreshLobby()">手動重新整理</button>
        </div>
    </div>

    <div id="screen-waiting" class="screen">
        <div class="card">
            <h1>等待玩家加入</h1>
            <p class="subtitle" style="margin-top: 20px;">房間已建立，等待對手進入...</p>
            <div style="font-size: 36px; margin: 20px 0;">⏳</div>
            <button class="btn btn-danger" onclick="app.cancelRoom()">取消房間</button>
        </div>
    </div>

    <div id="screen-battle" class="screen">
        <div class="battle-hud">
            <div class="player-box">
                <div id="avatar-me" class="player-avatar">🐱</div>
                <div class="player-info">
                    <div id="name-me" style="font-weight: bold; color: #38bdf8;">我方</div>
                    <div style="font-size: 12px; color: #94a3b8;">得分: <span id="score-me">0</span></div>
                    <div class="hp-bar"><div id="hp-me" class="hp-fill" style="width: 100%;"></div></div>
                </div>
            </div>
            <div style="font-size: 20px; font-weight: bold; color: #64748b;">VS</div>
            <div class="player-box">
                <div class="player-info right">
                    <div id="name-op" style="font-weight: bold; color: #f43f5e;">對手</div>
                    <div style="font-size: 12px; color: #94a3b8;">得分: <span id="score-op">0</span></div>
                    <div class="hp-bar"><div id="hp-op" class="hp-fill" style="width: 100%;"></div></div>
                </div>
                <div id="avatar-op" class="player-avatar">🐶</div>
            </div>
        </div>

        <div id="question-card" class="question-card">
            <div id="question-text" class="question-text">(-15) + 8 = ?</div>
            <div class="options-grid">
                <button class="option-btn" onclick="app.submitAnswer(0)">A. -7</button>
                <button class="option-btn" onclick="app.submitAnswer(1)">B. -23</button>
                <button class="option-btn" onclick="app.submitAnswer(2)">C. 7</button>
                <button class="option-btn" onclick="app.submitAnswer(3)">D. 23</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="overlay">
        <div id="modal-title" class="overlay-title">訊息</div>
        <div id="modal-desc" class="overlay-desc">內容說明</div>
        <button id="modal-btn" class="btn" style="max-width: 200px;" onclick="app.closeModal()">確定</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjgqpxkvnbhjpqidkpdh.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_DY08iNcbJPGCU17t_6WJkA_myFXMOSz';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const ANIMALS = ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐧', '🐸'];

        class GameApp {
            constructor() {
                this.clientToken = this.getOrCreateClientToken();
                this.nickname = '';
                this.currentRoomId = null;
                this.currentSeat = null;
                this.lobbyChannel = null;
                this.gameChannel = null;
                this.roomStateChannel = null;
                this.heartbeatTimer = null;
                this.disconnectTimer = null;
                this.opponentWasPresent = false;
                this.currentQuestion = null;
                this.lastEventId = null;
                this.isAnswering = false;

                this.initDBCheck();
                this.setupPageHide();
            }

            getOrCreateClientToken() {
                let token = localStorage.getItem('sequence_battle_client_token');
                if (!token) {
                    token = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                    localStorage.setItem('sequence_battle_client_token', token);
                }
                return token;
            }

            async initDBCheck() {
                try {
                    const { data, error } = await supabaseClient.rpc('list_live_rooms');
                    if (error) throw error;
                    document.getElementById('db-status').innerText = '資料庫已連接';
                    document.getElementById('db-status').style.background = '#15803d';
                } catch (e) {
                    document.getElementById('db-status').innerText = '資料庫連線失敗';
                    document.getElementById('db-status').style.background = '#b91c1c';
                }
            }

            showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            }

            showModal(title, desc, buttonText = '確定', onBtnClick = null) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-desc').innerText = desc;
                const btn = document.getElementById('modal-btn');
                btn.innerText = buttonText;
                btn.onclick = () => {
                    this.closeModal();
                    if (onBtnClick) onBtnClick();
                };
                document.getElementById('modal-overlay').classList.add('active');
            }

            closeModal() {
                document.getElementById('modal-overlay').classList.remove('active');
            }

            enterLobby() {
                const input = document.getElementById('input-nickname').value.trim();
                if (!input || input.length < 1 || input.length > 20) {
                    alert('請輸入 1 至 20 字的暱稱');
                    return;
                }
                this.nickname = input;
                document.getElementById('display-nickname').innerText = this.nickname;
                this.showScreen('screen-lobby');
                this.subscribeLobby();
                this.refreshLobby();
            }

            subscribeLobby() {
                if (this.lobbyChannel) return;
                this.lobbyChannel = supabaseClient
                    .channel('public:rooms')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
                        this.refreshLobby();
                    })
                    .subscribe();
            }

            async refreshLobby() {
                try {
                    const { data, error } = await supabaseClient.rpc('list_live_rooms');
                    if (error) throw error;
                    
                    const container = document.getElementById('room-list');
                    container.innerHTML = '';

                    // 排除自己建立的房間，避免自己點擊加入自己的房間
                    const availableRooms = (data || []).filter(room => room.host_client_token !== this.clientToken);

                    if (availableRooms.length === 0) {
                        container.innerHTML = '<div style="padding: 15px; color: #64748b; font-size: 14px;">目前沒有其他玩家的等待房間</div>';
                        return;
                    }

                    availableRooms.forEach(room => {
                        const item = document.createElement('div');
                        item.className = 'room-item';
                        item.innerHTML = `
                            <div>
                                <span style="color: #f1f5f9; font-weight: bold;">${room.host_nickname}</span> 的房間
                            </div>
                            <button class="btn" onclick="app.joinRoomProbe('${room.room_id}')">加入對戰</button>
                        `;
                        container.appendChild(item);
                    });
                } catch (e) {
                    console.error('Refresh lobby error:', e);
                }
            }

            async createRoom() {
                try {
                    const { data, error } = await supabaseClient.rpc('create_room', {
                        p_nickname: this.nickname,
                        p_client_token: this.clientToken
                    });
                    if (error) throw error;

                    this.currentRoomId = data.room_id;
                    this.currentSeat = 1;

                    this.showScreen('screen-waiting');
                    this.startHeartbeat();
                    this.listenJoinProbe();
                    this.listenRoomStateForHost();
                } catch (e) {
                    this.showModal('錯誤', e.message || '建立房間失敗');
                }
            }

            // 房主在等待畫面時監聽房間狀態變更，當 status 變成 playing 時自動進入對戰
            listenRoomStateForHost() {
                if (this.roomStateChannel) supabaseClient.removeChannel(this.roomStateChannel);
                
                this.roomStateChannel = supabaseClient
                    .channel(`public:rooms:id=eq.${this.currentRoomId}`)
                    .on('postgres_changes', { 
                        event: 'UPDATE', 
                        schema: 'public', 
                        table: 'rooms', 
                        filter: `id=eq.${this.currentRoomId}` 
                    }, payload => {
                        if (payload.new && payload.new.status === 'playing') {
                            supabaseClient.removeChannel(this.roomStateChannel);
                            this.roomStateChannel = null;
                            this.enterBattleScreen();
                        }
                    })
                    .subscribe();
            }

            startHeartbeat() {
                this.stopHeartbeat();
                this.heartbeatTimer = setInterval(async () => {
                    if (this.currentRoomId && this.currentSeat === 1) {
                        await supabaseClient.rpc('heartbeat_room', {
                            p_room_id: this.currentRoomId,
                            p_client_token: this.clientToken
                        });
                    }
                }, 3000);
            }

            stopHeartbeat() {
                if (this.heartbeatTimer) {
                    clearInterval(this.heartbeatTimer);
                    this.heartbeatTimer = null;
                }
            }

            listenJoinProbe() {
                this.cleanupGameChannel();
                this.gameChannel = supabaseClient.channel(`game-${this.currentRoomId}`);
                
                this.gameChannel
                    .on('broadcast', { event: 'join_probe' }, ({ payload }) => {
                        if (payload && payload.probe_id) {
                            this.gameChannel.send({
                                type: 'broadcast',
                                event: 'host_ack',
                                payload: { probe_id: payload.probe_id }
                            });
                        }
                    })
                    .subscribe();
            }

            async cancelRoom() {
                this.stopHeartbeat();
                if (this.roomStateChannel) {
                    supabaseClient.removeChannel(this.roomStateChannel);
                    this.roomStateChannel = null;
                }
                if (this.currentRoomId) {
                    await supabaseClient.rpc('cancel_room', {
                        p_room_id: this.currentRoomId,
                        p_client_token: this.clientToken
                    });
                }
                this.cleanupGameChannel();
                this.currentRoomId = null;
                this.currentSeat = null;
                this.showScreen('screen-lobby');
                this.refreshLobby();
            }

            async joinRoomProbe(roomId) {
                const probeId = 'probe_' + Math.random().toString(36).substring(2, 9);
                let ackReceived = false;

                const tempChannel = supabaseClient.channel(`game-${roomId}`);
                
                tempChannel.on('broadcast', { event: 'host_ack' }, ({ payload }) => {
                    if (payload && payload.probe_id === probeId) {
                        ackReceived = true;
                    }
                }).subscribe();

                await new Promise(r => setTimeout(r, 300));

                tempChannel.send({
                    type: 'broadcast',
                    event: 'join_probe',
                    payload: { probe_id: probeId }
                });

                for (let i = 0; i < 20; i++) {
                    if (ackReceived) break;
                    await new Promise(r => setTimeout(r, 100));
                }

                supabaseClient.removeChannel(tempChannel);

                if (ackReceived) {
                    this.executeJoinRoom(roomId);
                } else {
                    this.showModal('提示', '房主已離開，請選其他房間。', '確定', () => this.refreshLobby());
                }
            }

            async executeJoinRoom(roomId) {
                try {
                    const { data, error } = await supabaseClient.rpc('join_room', {
                        p_room_id: roomId,
                        p_nickname: this.nickname,
                        p_client_token: this.clientToken
                    });
                    if (error) {
                        if (error.message.includes('HOST_OFFLINE')) {
                            this.showModal('提示', '房主已離線，請選擇其他房間。');
                        } else {
                            this.showModal('加入失敗', error.message);
                        }
                        this.refreshLobby();
                        return;
                    }

                    this.currentRoomId = roomId;
                    this.currentSeat = 2;
                    this.enterBattleScreen();
                } catch (e) {
                    this.showModal('錯誤', e.message || '無法加入房間');
                }
            }

            enterBattleScreen() {
                this.stopHeartbeat();
                if (this.roomStateChannel) {
                    supabaseClient.removeChannel(this.roomStateChannel);
                    this.roomStateChannel = null;
                }
                this.showScreen('screen-battle');
                this.setupBattleChannel();
                this.generateQuestion();
            }

            getAvatars(roomId) {
                let hash = 0;
                for (let i = 0; i < roomId.length; i++) {
                    hash = roomId.charCodeAt(i) + ((hash << 5) - hash);
                }
                const idx1 = Math.abs(hash) % ANIMALS.length;
                const idx2 = (idx1 + 3) % ANIMALS.length;
                return [ANIMALS[idx1], ANIMALS[idx2]];
            }

            setupBattleChannel() {
                this.cleanupGameChannel();
                this.opponentWasPresent = false;

                const [avatar1, avatar2] = this.getAvatars(this.currentRoomId);
                
                if (this.currentSeat === 1) {
                    document.getElementById('avatar-me').innerText = avatar1;
                    document.getElementById('avatar-op').innerText = avatar2;
                } else {
                    document.getElementById('avatar-me').innerText = avatar2;
                    document.getElementById('avatar-op').innerText = avatar1;
                }

                this.gameChannel = supabaseClient.channel(`game-${this.currentRoomId}`, {
                    config: { presence: { key: this.clientToken } }
                });

                supabaseClient
                    .channel(`public:game_state:room=eq.${this.currentRoomId}`)
                    .on('postgres_changes', { 
                        event: 'UPDATE', 
                        schema: 'public', 
                        table: 'game_state',
                        filter: `room_id=eq.${this.currentRoomId}` 
                    }, payload => {
                        this.handleGameStateUpdate(payload.new);
                    })
                    .subscribe();

                this.gameChannel
                    .on('presence', { event: 'sync' }, () => {
                        const state = this.gameChannel.presenceState();
                        const presenceKeys = Object.keys(state);

                        const opponentPresent = presenceKeys.some(key => key !== this.clientToken);

                        if (opponentPresent) {
                            this.opponentWasPresent = true;
                            if (this.disconnectTimer) {
                                clearTimeout(this.disconnectTimer);
                                this.disconnectTimer = null;
                            }
                        } else if (this.opponentWasPresent) {
                            if (!this.disconnectTimer) {
                                this.disconnectTimer = setTimeout(() => {
                                    this.showModal('對戰中斷', '對手已斷線。', '回到大廳', () => this.leaveBattleToLobby());
                                }, 5000);
                            }
                        }
                    })
                    .subscribe(async (status) => {
                        if (status === 'SUBSCRIBED') {
                            await this.gameChannel.track({
                                seat: this.currentSeat,
                                nickname: this.nickname
                            });
                        }
                    });
            }

            handleGameStateUpdate(state) {
                if (!state) return;

                const isSeat1 = (this.currentSeat === 1);
                const myHp = isSeat1 ? state.player1_hp : state.player2_hp;
                const opHp = isSeat1 ? state.player2_hp : state.player1_hp;
                const myScore = isSeat1 ? state.player1_score : state.player2_score;
                const opScore = isSeat1 ? state.player2_score : state.player1_score;

                document.getElementById('name-me').innerText = (isSeat1 ? state.player1_name : state.player2_name) || '我方';
                document.getElementById('name-op').innerText = (isSeat1 ? state.player2_name : state.player1_name) || '對手';

                document.getElementById('score-me').innerText = myScore;
                document.getElementById('score-op').innerText = opScore;

                document.getElementById('hp-me').style.width = `${(myHp / 7) * 100}%`;
                document.getElementById('hp-op').style.width = `${(opHp / 7) * 100}%`;

                if (state.last_event_id && state.last_event_id !== this.lastEventId) {
                    this.lastEventId = state.last_event_id;
                    this.triggerEventAnimation(state.last_event_type, state.last_event_seat);
                }

                if (state.status === 'finished') {
                    setTimeout(() => {
                        if (state.winner_seat === this.currentSeat) {
                            this.showModal('🎉 獲得勝利！', '太棒了！你展現了優秀的整數計算能力！', '回到遊戲大廳', () => this.leaveBattleToLobby());
                        } else {
                            this.showModal('💪 再接再厲！', '差一點就贏了，再試一次累積更多實力！', '回到遊戲大廳', () => this.leaveBattleToLobby());
                        }
                    }, 500);
                }
            }

            triggerEventAnimation(eventType, eventSeat) {
                const isMyEvent = (eventSeat === this.currentSeat);
                const card = document.getElementById('question-card');

                if (eventType === 'hit') {
                    if (isMyEvent) {
                        card.classList.add('effect-hit');
                        setTimeout(() => card.classList.remove('effect-hit'), 400);
                    }
                } else if (eventType === 'self_hit') {
                    if (isMyEvent) {
                        card.classList.add('effect-shake');
                        setTimeout(() => card.classList.remove('effect-shake'), 400);
                    }
                }
            }

            generateQuestion() {
                this.isAnswering = false;
                const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                
                let a = randInt(-30, 30);
                let b = randInt(-30, 30);
                while (a === 0) a = randInt(-30, 30);
                while (b === 0) b = randInt(-30, 30);

                const isAddition = Math.random() > 0.5;
                const operator = isAddition ? '+' : '-';
                const correctAns = isAddition ? (a + b) : (a - b);

                const options = new Set([correctAns]);
                while (options.size < 4) {
                    let offset = randInt(-5, 5);
                    if (offset !== 0) options.add(correctAns + offset);
                }

                const optionsArr = Array.from(options).sort(() => Math.random() - 0.5);

                const formatNum = (n) => n < 0 ? `(${n})` : `${n}`;
                const questionStr = `${formatNum(a)} ${operator} ${formatNum(b)} = ?`;

                this.currentQuestion = {
                    text: questionStr,
                    options: optionsArr,
                    correctIndex: optionsArr.indexOf(correctAns)
                };

                document.getElementById('question-text').innerText = this.currentQuestion.text;
                const btnContainer = document.querySelector('.options-grid');
                btnContainer.innerHTML = '';

                this.currentQuestion.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = `${['A', 'B', 'C', 'D'][idx]}. ${opt}`;
                    btn.onclick = () => this.submitAnswer(idx);
                    btnContainer.appendChild(btn);
                });
            }

            async submitAnswer(selectedIndex) {
                if (this.isAnswering) return;
                this.isAnswering = true;

                const isCorrect = (selectedIndex === this.currentQuestion.correctIndex);

                try {
                    await supabaseClient.rpc('resolve_answer', {
                        p_room_id: this.currentRoomId,
                        p_client_token: this.clientToken,
                        p_is_correct: isCorrect
                    });
                } catch (e) {
                    console.error('Resolve answer error:', e);
                }

                setTimeout(() => this.generateQuestion(), 600);
            }

            cleanupGameChannel() {
                if (this.gameChannel) {
                    supabaseClient.removeChannel(this.gameChannel);
                    this.gameChannel = null;
                }
                if (this.disconnectTimer) {
                    clearTimeout(this.disconnectTimer);
                    this.disconnectTimer = null;
                }
            }

            leaveBattleToLobby() {
                this.cleanupGameChannel();
                this.stopHeartbeat();
                if (this.roomStateChannel) {
                    supabaseClient.removeChannel(this.roomStateChannel);
                    this.roomStateChannel = null;
                }
                this.currentRoomId = null;
                this.currentSeat = null;
                this.showScreen('screen-lobby');
                this.refreshLobby();
            }

            setupPageHide() {
                window.addEventListener('pagehide', () => {
                    if (this.currentRoomId && this.currentSeat === 1) {
                        const url = `${SUPABASE_URL}/rest/v1/rpc/cancel_room`;
                        const data = JSON.stringify({
                            p_room_id: this.currentRoomId,
                            p_client_token: this.clientToken
                        });
                        navigator.sendBeacon(url, data);
                    }
                });
            }
        }

        const app = new GameApp();
    </script>
</body>
</html>
